<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body{
            padding:20px;
            display:block;
        }

        .dashboard{
            max-width:1200px;
            margin:auto;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2{
            font-size:1rem;
            margin-bottom:10px;
        }

        .numero{
            font-size:2rem;
            font-weight:bold;
            color:#3498db;
        }

        .grafico-container{
            background:white;
            padding:20px;
            border-radius:10px;
            margin-bottom:30px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        th, td{
            padding:12px;
            border-bottom:1px solid #ddd;
            text-align:center;
        }

        th{
            background:#3498db;
            color:white;
        }
    </style>
</head>
<body>

<div class="dashboard">

    <h1>Painel do Refeitório</h1>

    <div class="cards">
        <div class="card">
            <h2>Vão Almoçar</h2>
            <div class="numero" id="totalAlmoco">0</div>
        </div>

        <div class="card">
            <h2>2ª Proteína</h2>
            <div class="numero" id="totalProteina">0</div>
        </div>

        <div class="card">
            <h2>Avaliações Positivas</h2>
            <div class="numero" id="avaliacoesPositivas">0</div>
        </div>
    </div>

    <div class="grafico-container">

    <h2>Selecionar Data</h2>

    <input type="date" id="filtroData">

    <button onclick="filtrar()">Buscar</button>

</div>

    <div class="grafico-container">
        <canvas id="graficoQualidade"></canvas>
    </div>

    <h2 style="margin-bottom:15px;">Respostas Registradas</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Vai Almoçar</th>
                <th>2ª Proteína</th>
                <th>Qualidade</th>
                <th>Data</th>
            </tr>
        </thead>

        <tbody id="tabelaDados"></tbody>
    </table>

</div>

<script>
    if(localStorage.getItem('adminLogado') !== 'true'){

    window.location.href = 'login.html';

}

async function carregarRelatorio(data=''){

   const response = await fetch(`http://localhost:3000/api/relatorio?data=${data}`);

    const dados = await response.json();
    function filtrar(){

    const data = document.getElementById('filtroData').value;

    carregarRelatorio(data);

}

    let totalAlmoco = 0;
    let totalProteina = 0;
    let positivas = 0;

    let otimo = 0;
    let bom = 0;
    let ruim = 0;

    const tabela = document.getElementById('tabelaDados');

    tabela.innerHTML = '';

    dados.forEach(item => {

        if(item.vai_almocar === 'Sim'){
            totalAlmoco++;
        }

        if(item.segunda_proteina === 'Sim'){
            totalProteina++;
        }

        if(item.qualidade_comida === 'Ótimo'){
            otimo++;
            positivas++;
        }

        if(item.qualidade_comida === 'Bom'){
            bom++;
            positivas++;
        }

        if(item.qualidade_comida === 'Ruim'){
            ruim++;
        }

        tabela.innerHTML += `
            <tr>
                <td>${item.id}</td>
                <td>${item.vai_almocar}</td>
                <td>${item.segunda_proteina}</td>
                <td>${item.qualidade_comida}</td>
                <td>${item.data_registro}</td>
            </tr>
        `;
    });

    document.getElementById('totalAlmoco').textContent = totalAlmoco;
    document.getElementById('totalProteina').textContent = totalProteina;
    document.getElementById('avaliacoesPositivas').textContent = positivas;

    new Chart(document.getElementById('graficoQualidade'), {
        type:'bar',
        data:{
            labels:['Ótimo','Bom','Ruim'],
            datasets:[{
                label:'Qualidade da Comida',
                data:[otimo,bom,ruim]
            }]
        }
    });

}

carregarRelatorio();

</script>

</body>
</html>
